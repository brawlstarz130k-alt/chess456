name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare Android Project
        run: |
          mkdir -p apk_build/app/src/main/java/com/grandmaster/studio
          mkdir -p apk_build/app/src/main/res/values
          mkdir -p apk_build/app/src/main/res/drawable
          mkdir -p apk_build/app/src/main/assets
          cp index.html apk_build/app/src/main/assets/index.html

          cat << 'EOF' > apk_build/settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "GrandmasterStudio"
          include(":app")
          EOF

          cat << 'EOF' > apk_build/build.gradle
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat << 'EOF' > apk_build/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > apk_build/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.grandmaster.studio'
              compileSdk 34
              defaultConfig {
                  applicationId "com.grandmaster.studio"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "3.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {}
          EOF

          cat << 'EOF' > apk_build/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Grandmaster Studio"
                  android:roundIcon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > apk_build/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.DeviceDefault.NoActionBar">
                  <item name="android:statusBarColor">#060911</item>
                  <item name="android:navigationBarColor">#060911</item>
                  <item name="android:windowBackground">#060911</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > apk_build/app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0B1324" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#22C55E" android:pathData="M54,18 L60,30 L72,30 L64,42 L74,78 L34,78 L44,42 L36,30 L48,30 Z"/>
              <path android:fillColor="#F5B942" android:pathData="M30,82 L78,82 L78,90 L30,90 Z"/>
          </vector>
          EOF

          cat << 'EOF' > apk_build/app/src/main/java/com/grandmaster/studio/MainActivity.java
          package com.grandmaster.studio;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.setBackgroundColor(0xFF060911);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF
      - name: Build Debug APK
        working-directory: apk_build
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grandmaster-Studio-APK
          path: apk_build/app/build/outputs/apk/debug/app-debug.apk
